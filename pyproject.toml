[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fixonce"
version = "0.1.2"
description = "Turn a merged security fix into a tested Semgrep rule, hunt variants, and block the bug from coming back."
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "anthropic>=0.40"]

[project.optional-dependencies]
dev = ["pytest", "semgrep"]

[project.scripts]
fixonce = "fixonce.cli:main"

[tool.setuptools]
packages = ["fixonce"]
